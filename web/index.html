<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- شاشة تسجيل الدخول -->
    <section id="join-section" class="join-section">

        <div class="join-box">

            <h1>Simple Contact</h1>

            <p>تطبيق محادثة فورية</p>

            <label for="username-input">
                اسم المستخدم
            </label>

            <input type="text" id="username-input" placeholder="أدخل اسمك" autocomplete="off" maxlength="30">

            <button id="join-btn">
                انضمام
            </button>

            <p id="join-error" class="error-message"></p>

        </div>

    </section>


    <!-- واجهة المحادثة -->
    <section id="chat-section" class="chat-section hidden">

        <!-- Header -->
        <header class="header">

            <div class="header-info">

                <h1>Simple Contact</h1>

                <span id="current-user-display">
                    غير متصل
                </span>

            </div>

            <div id="connection-status" class="connection-status">
                <span id="status-text">
                    غير متصل
                </span>
            </div>

        </header>


        <main class="chat-layout">

            <!-- قائمة المستخدمين -->
            <aside class="users-panel">

                <div class="users-header">

                    <h2>المستخدمون المتصلون</h2>

                    <span id="users-count">
                        0
                    </span>

                </div>

                <ul id="users-list">
                    <!-- يتم إضافة المستخدمين بواسطة JavaScript -->
                </ul>

            </aside>


            <!-- منطقة المحادثة -->
            <section class="conversation">

                <div class="conversation-header">

                    <h2 id="target-user-display">
                        اختر مستخدمًا للمحادثة
                    </h2>

                </div>


                <!-- صندوق الرسائل -->
                <div id="messages-box" class="messages-box">

                    <div class="empty-chat">
                        اختر مستخدمًا من القائمة لبدء المحادثة.
                    </div>

                </div>


                <!-- نموذج إرسال الرسالة -->
                <form id="message-form" class="message-form">

                    <input type="text" id="message-input" placeholder="اكتب رسالتك..." autocomplete="off" disabled>

                    <button type="submit" id="send-btn" disabled>
                        إرسال
                    </button>

                </form>

            </section>

        </main>


        <!-- زر قطع الاتصال -->
        <button id="disconnect-btn" class="disconnect-btn">
            قطع الاتصال
        </button>

    </section>


    <script src="app.js"></script>

</body>

</html>
